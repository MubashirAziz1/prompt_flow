<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prompt Enhancer</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="panel">
      <h1>Prompt Enhancer</h1>
      <label for="prompt-input">Rough prompt</label>
      <textarea
        id="prompt-input"
        name="prompt"
        rows="10"
        placeholder="Enter a rough prompt"
      ></textarea>
      <button type="button" id="enhance-button">Enhance</button>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
