<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prompt Enhancer</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="panel">
      <div class="panel-header">
        <h1>Prompt Enhancer</h1>
        <a id="open-settings" href="#">Settings</a>
      </div>
      <label for="prompt-input">Rough prompt</label>
      <textarea
        id="prompt-input"
        name="prompt"
        rows="10"
        placeholder="Enter a rough prompt"
      ></textarea>
      <button type="button" id="enhance-button">Enhance</button>
      <label for="prompt-output">Enhanced prompt</label>
      <textarea
        id="prompt-output"
        name="enhancedPrompt"
        rows="10"
        readonly
      ></textarea>
      <p id="enhance-status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
